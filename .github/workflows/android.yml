name: Gerar APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Unzip
        run: |
          ZIP=$(find . -name "*.zip" | head -n1)
          if [ -f "$ZIP" ]; then
            sudo apt-get install -y unzip
            unzip -o "$ZIP"
          fi
      - name: Build
        run: |
          GRADLEW=$(find . -type f -name gradlew | head -n1)
          chmod +x "$GRADLEW"
          cd $(dirname "$GRADLEW")
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Visao
          path: "**/app-debug.apk"
